<!--
  LEAP GYMNASTICS — Registration Page Card Standardization
  Paste this into Uplifter's "Custom CSS" area (Site Settings > Design > Custom Code).

  ISSUE: Registration page program cards are inconsistent — school-year cards
  show dates, times, and installment details, while summer/camp cards show
  vague descriptions without key details. This CSS standardizes the visual
  layout. The content itself (descriptions, dates, times) must be updated
  in Uplifter's program admin — see the notes at the bottom of this file.
-->

<style>
  /*
   * Standardize registration program card height and layout.
   * Cards should all show the same visual rhythm:
   * [Title] → [Short description] → [Pricing line] → [Options]
   */

  /* Even out card spacing */
  .product-card,
  .program-card,
  .registration-product,
  [class*="product-card"],
  [class*="program-card"] {
    margin-bottom: 24px !important;
    padding: 20px !important;
    border: 1px solid #e0e0e0 !important;
    border-radius: 8px !important;
    background: #ffffff !important;
  }

  /* Limit description length so cards don't bloat with long text */
  .product-card .description,
  .program-card .description,
  .registration-product .description,
  [class*="product-card"] p,
  [class*="program-card"] p {
    max-height: 4.8em;
    overflow: hidden;
    line-height: 1.6;
  }

  /* Make pricing/session lines prominent and consistent */
  .product-card .pricing,
  .program-card .pricing,
  [class*="pricing"],
  [class*="session-info"] {
    font-weight: 600 !important;
    font-size: 14px !important;
    color: #333 !important;
    background: #f8f9fa !important;
    padding: 8px 12px !important;
    border-radius: 4px !important;
    margin: 12px 0 !important;
  }

  /* Style register/detail links consistently */
  .product-card a[href*="product-detail"],
  .program-card a[href*="product-detail"],
  [class*="product-card"] a[href*="registration"],
  [class*="view-details"],
  a[class*="register-link"] {
    display: inline-block !important;
    color: #00796b !important;
    font-weight: 600 !important;
    font-size: 14px !important;
    text-decoration: none !important;
    padding: 8px 0 !important;
  }
</style>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Birthday preparation | Leap Gymnastics</title><link rel="stylesheet" href="/connected.css"><script type="module" src="/staff.js"></script></head><body><header><img src="/assets/leap-logo-white.png" alt="Leap Gymnastics" width="112" height="54"><span>Birthday preparation</span></header><main><h1>Birthday preparation</h1><p id="notice" role="status"></p><div id="login"><p>Sign in with a secure link sent to the Leap inbox.</p><button id="signIn">Email sign-in link</button></div><div id="workspace" hidden><div class="toolbar"><button id="refresh">Refresh</button><button id="print" class="secondary">Print open party sheets</button><button id="signOut" class="secondary">Sign out</button></div><p id="sync"></p><div id="exceptions"></div><div id="parties"></div></div></main><dialog id="reconcileDialog"><form id="reconcileForm"><h2>Check booking against Uplifter</h2><p id="reconcileInvoice"></p><label>Actual booked start, Toronto time<input name="start" type="datetime-local" required></label><label>Confirmed package<select name="package"><option>Basic</option><option>Premium</option><option>Deluxe</option></select></label><label>Booking email<input name="email" type="email" required></label><label class="check"><input name="checkedInvoice" type="checkbox" required>I checked the current Uplifter invoice and this booking is active. These details match that invoice.</label><p>Existing details are retained unless the package changed. A changed date requires a fresh check of any optional extras. The parent receives an updated link.</p><div class="actions"><button type="button" id="closeReconcile" class="secondary">Back</button><button type="submit">Save checked booking</button></div></form></dialog></body></html>
